name: NetCoreUtils.Database

on:
#   push:
#     branches:
#       - main
    workflow_dispatch: # manually trigger
#     inputs:
#       tag_version:  # use with: ${{ github.event.inputs.tag_version }}
#         description: 'Tag version for the release (e.g., v1.0.0)'
#         required: false
#         default: 'latest'

jobs:
  build:

    # runs-on: windows-latest
    runs-on: ubuntu-24.04
    permissions:
      id-token: write   # enable GitHub OIDC token issuance for nuget.org trusted publishing
      contents: write   # create the GitHub Release
      packages: write   # push to GitHub Packages
 

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
        source-url: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
      env:
        NUGET_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}

    - name: Pack
      run: dotnet pack NetCoreUtils.Database/NetCoreUtils.Database/NetCoreUtils.Database.csproj --configuration Release --output bin/Pack

    - name: View packed file
      run: cd bin/Pack && ls

    - name: Upload NuGet packages
      uses: actions/upload-artifact@v4
      id: artifact-upload-step
      with:
        name: nupkg-files
        path: bin/Pack/*.nupkg

    - name: Publish to GitHub Packages
      run: dotnet nuget push bin/Pack/*.nupkg

    - name: Get csproj version
      id: package_version
      shell: bash
      run: |
        version=$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' NetCoreUtils.Database/NetCoreUtils.Database/NetCoreUtils.Database.csproj | head -1)
        echo "version=$version" >> "$GITHUB_OUTPUT"

    #----------------------------------------------------------------------
    # Publish to GitHub Release
    #----------------------------------------------------------------------

    - name: Generate release notes body
      run: |
        echo "Download package file from: ${{ steps.artifact-upload-step.outputs.artifact-url }}" > release-body.md
        echo "The above download link may expire in 90 days." >> release-body.md
        echo "" >> release-body.md
        awk -v ver="v${{ steps.package_version.outputs.version }}" '
          index($0, "## " ver) == 1 { found = 1; next }
          found && /^## / { exit }
          found { print }
        ' NetCoreUtils.Database/NetCoreUtils.Database/release-notes.md >> release-body.md
        cat release-body.md

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        #tag_name: ${{ github.event.inputs.tag_version }}  # use the manually input workflow_dispatch parameter
        tag_name: db_${{ steps.package_version.outputs.version }}
        name: "NetCoreUtils.Database v${{ steps.package_version.outputs.version }}"
        body_path: release-body.md
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    #----------------------------------------------------------------------
    # Publish to NuGet.org
    #----------------------------------------------------------------------

    # Get a short-lived NuGet API key
    - name: NuGet login (OIDC → temp API key)
      uses: NuGet/login@v1
      id: nuget_login
      with:
        user: ${{ secrets.NUGET_USER }}
  
    # Push the package to NuGet.org
    - name: NuGet push
      run: dotnet nuget push bin/Pack/*.nupkg --api-key ${{steps.nuget_login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json

        

  
